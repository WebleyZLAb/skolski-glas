<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8" />
  <title>Школски глас · Плакат</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800;900&family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #888; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 32px 0; }
    .print-page {
      position: relative;
      width: 720px;
      height: 1080px;
      overflow: hidden;
      box-shadow: 0 8px 48px rgba(0,0,0,.4);
    }
    @media print {
      html, body { background: white; padding: 0; margin: 0; display: block; }
      .print-page {
        width: 720px;
        height: 1080px;
        box-shadow: none;
        overflow: hidden;
      }
      @page { size: 210mm 297mm; margin: 0; }
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="decorations.jsx"></script>
  <script type="text/babel" src="mag-shell.jsx"></script>
  <script type="text/babel" src="pages-plakat.jsx"></script>

  <script type="text/babel">
    function App() {
      return (
        <div className="print-page">
          <PagePlakat />
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
